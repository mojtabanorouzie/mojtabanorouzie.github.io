name: Deploy to GitHub Pages

# Builds nothing (static site) — just publishes the repo root to GitHub Pages
# on every push to main. Works for both <username>.github.io repos and project repos.

on:
  push:
    branches: [main]
  workflow_dispatch: # lets you trigger a deploy manually from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; cancel in-progress runs for new pushes
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Build the résumé PDF from resume/resume.html into assets/ so it ships in
      # the same Pages artifact the site links to.
      - name: Install PDF builder deps
        working-directory: resume
        run: npm ci || npm install

      - name: Install Chromium for Playwright
        working-directory: resume
        run: npx playwright install --with-deps chromium

      - name: Build résumé PDF
        run: node resume/build-pdf.mjs

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: . # the whole repo root (index.html + freshly built assets/ PDF)

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
