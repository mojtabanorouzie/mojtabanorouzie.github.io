name: Deploy to GitHub Pages

# Publishes the repo root to GitHub Pages on every push to main. Not a plain copy:
# the blog (content/blog/*.md -> blog/), the résumé PDF (resume/resume.html ->
# assets/) and the social card are all generated below, before the artifact is
# uploaded, so the deployed site carries freshly built output alongside the
# checked-in HTML. ci.yml mirrors these same build steps for pull requests.
# Works for both <username>.github.io repos and project repos.

on:
  push:
    branches: [main]
  workflow_dispatch: # lets you trigger a deploy manually from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; cancel in-progress runs for new pushes
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 20

      # Build the blog from content/blog/*.md into blog/ (plus sitemap.xml and
      # robots.txt). Runs before the artifact upload, like the PDF below.
      - name: Install blog builder deps
        working-directory: tools/blog
        run: npm ci || npm install

      - name: Test blog builder
        working-directory: tools/blog
        run: npm test

      - name: Build blog
        run: node tools/blog/build.mjs

      # Build the résumé PDF from resume/resume.html into assets/ so it ships in
      # the same Pages artifact the site links to.
      - name: Install PDF builder deps
        working-directory: resume
        run: npm ci || npm install

      - name: Install Chromium for Playwright
        working-directory: resume
        run: npx playwright install --with-deps chromium

      - name: Build résumé PDF
        run: node resume/build-pdf.mjs

      # The social card shares the Chromium installed above — tools/og pins the
      # same Playwright version, so nothing extra is downloaded.
      - name: Install social card builder deps
        working-directory: tools/og
        run: npm ci || npm install

      - name: Build social card
        run: node tools/og/build-og.mjs

      - name: Configure Pages
        uses: actions/configure-pages@v6

      # upload-pages-artifact v4 stopped including dotfiles. The only one under
      # the published root is blog/.generated, a build-time marker that
      # tools/blog/build.mjs writes and reads before this step runs, so the
      # deployed site does not need it. If a dotfile ever does need publishing
      # (a .nojekyll, say), set include-hidden-files: true here.
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: . # the whole repo root (index.html + freshly built assets/ PDF)

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
